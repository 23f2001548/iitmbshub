<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square with shadow -->
  <rect x="5" y="5" width="90" height="90" rx="25" fill="url(#grad1)" filter="url(#shadow)" />
  
  <!-- Outer glowing ring -->
  <rect x="15" y="15" width="70" height="70" rx="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Graduation cap polygon (top) -->
  <polygon points="50,30 75,42.5 50,55 25,42.5" fill="white" />
  
  <!-- Graduation cap base (skullcap part) -->
  <path d="M 33 46.5 L 33 62 Q 50 72 67 62 L 67 46.5" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Tassel -->
  <path d="M 50 42.5 Q 70 50 82 55 L 82 68" fill="none" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" />
  <circle cx="82" cy="71" r="4" fill="url(#grad2)" />
  
  <!-- Small dot for the button on top of cap -->
  <circle cx="50" cy="42.5" r="2.5" fill="url(#grad1)" />
</svg>